services:
  # Device Manager Service
  device-manager:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - NODE_ENV=production
    container_name: device-manager
    restart: unless-stopped
    ports:
      - "5057:5057"
    environment:
      - NODE_ENV=production
      - PORT=5057
    env_file:
      - ./config/.env
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./shared:/shared:ro
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.request({host: 'localhost', port: 5057, path: '/api/health', timeout: 5000}, (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1)); req.end();"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  backend-network:
    driver: bridge